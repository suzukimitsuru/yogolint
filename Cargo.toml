[workspace]
resolver = "3"
members = ["crates/yogolint-core", "crates/yogolint-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/suzukimitsuru/yogolint"

[workspace.dependencies]
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = "1"
