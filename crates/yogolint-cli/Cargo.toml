[package]
name = "yogolint"
description = "Lint the vocabulary of definition names against term dictionaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "yogolint"
path = "src/main.rs"

[dependencies]
yogolint-core = { path = "../yogolint-core" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
globset = "0.4"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
