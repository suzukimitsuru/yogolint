# yogolint 自身を検査する設定
languages = ["rust"]
include = ["crates/**"]
exclude = ["**/target/**"]
kinds = ["function", "type", "value", "constant"]
builtin-dictionaries = ["verbs", "nouns", "abbrev", "deny"]
dictionaries = ["dicts/domain.toml"]
allow-compound-words = false
min-word-length = 2
allow-single-letter = ["i", "j", "k", "n", "x", "y"]
ignore-words = []
