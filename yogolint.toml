# yogolint 自身を検査する設定
languages = ["rust"]
include = ["crates/**"]
exclude = ["**/target/**"]
kinds = ["function", "type", "value", "constant"]
builtinDictionaries = ["verbs", "nouns", "abbrev", "deny"]
dictionaries = ["dicts/domain.toml"]
allowCompoundWords = false
minWordLength = 2
allowSingleLetter = ["i", "j", "k", "n", "x", "y"]
ignoreWords = []
